# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    #
    # OJO: este fichero se sourcea DESPUES del hyprland.conf del tema, asi que
    # estos dos valores ganan a los que declare el tema. El tema ios-glass pide
    # 14 / 4; si se dejaran aqui en 8 / 2 no se aplicarian nunca.
    rounding = 14
    # 2 es un arco de circunferencia normal. Al subirlo la curvatura se vuelve
    # continua: la esquina empieza a doblarse antes y se funde con el lado
    # recto sin el cambio brusco que se aprecia con 2. Es el "squircle" de
    # Apple, y es la mitad de por que un icono de iOS se ve suave.
    rounding_power = 4

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#group
group {
    groupbar {
        # Match window rounding on group tabs
        gradient_rounding = 14
    }
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}
