# iOS Glass — hyprland
#
# ~/.config/hypr/hyprland.conf sourcea este fichero en su linea 13, ANTES que
# ~/.config/hypr/looknfeel.conf (linea 19). En hyprland gana lo ULTIMO que se
# lee, asi que cualquier valor que tambien aparezca en tu looknfeel.conf manda
# desde alli, no desde aqui. Hoy eso afecta solo a `rounding`, `rounding_power`
# y `gradient_rounding`: se dejan puestos abajo para que el tema sea completo
# si lo mueves a otra maquina, pero en ESTA los decide looknfeel.conf.
#
# Todo lo demas (blur, sombras, colores de borde, layerrules) no esta en tu
# looknfeel.conf, asi que se aplica tal cual y desaparece solo al cambiar de
# tema.

# Borde activo en degradado blanco -> azul iOS. El blanco imita el canto por
# donde entra la luz en el cristal; el azul marca el foco sin gritar.
$activeBorderColor = rgba(FFFFFF59) rgba(0A84FF66) 45deg
$inactiveBorderColor = rgba(FFFFFF14)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 14
    # 2 es una circunferencia normal. Subirlo curva la esquina de forma
    # continua, que es el "squircle" que usa Apple: la curva arranca antes y
    # entra en el lado recto sin el corte que se nota a 2.
    rounding_power = 4

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }

    # https://wiki.hypr.land/Configuring/Basics/Variables/#blur
    blur {
        enabled = true
        # size x passes es lo que cuesta. 8x3 da un esmerilado denso y va
        # sobrado en 1080p; si notaras tirones, baja passes a 2 antes que size.
        size = 8
        passes = 3
        new_optimizations = true

        # xray a false = el blur tambien recoge las VENTANAS de debajo, no solo
        # el fondo de escritorio. Es mas caro, pero es lo que hace que el panel
        # parezca cristal de verdad y no un recorte del wallpaper.
        xray = false

        # Grano finisimo. El cristal esmerilado real nunca es un degradado
        # limpio, y sin esto se ve el "banding" del desenfoque en degradados.
        noise = 0.02

        # Omarchy por defecto oscurece bastante (brightness 0.60). Aqui se sube
        # casi a neutro: el cristal de iOS ilumina lo que tapa, no lo apaga.
        brightness = 0.92
        contrast = 1.05

        # Satura lo que queda detras. Es el ingrediente que mas se nota del
        # look de visionOS: los colores del fondo "sangran" a traves del panel.
        vibrancy = 0.35
        vibrancy_darkness = 0.30

        # Los menus y desplegables tambien de cristal, no opacos.
        popups = true
        popups_ignorealpha = 0.30

        special = true
    }
}

# --- Movimiento -----------------------------------------------------------
#
# Tu looknfeel.conf tiene el bloque `animations` entero comentado, asi que esto
# no lo pisa nada y se va solo al cambiar de tema.
#
# La diferencia entre "suave" y "de iOS" es el rebote: una curva que PASA de su
# destino y vuelve. En bezier eso es un punto de control con y > 1 (el 1.28 de
# abajo). Con y <= 1 la animacion solo frena, que es lo que hace omarchy por
# defecto con easeOutQuint: correcto, pero inerte.
animations {
    bezier = iosOut, 0.32, 1.28, 0.38, 1
    bezier = iosInOut, 0.65, 0, 0.35, 1
    bezier = iosQuick, 0.22, 1, 0.36, 1

    animation = windows, 1, 3.4, iosOut
    animation = windowsIn, 1, 3.6, iosOut, popin 92%
    # Al cerrar NO se rebota: un rebote a la salida parece que la ventana
    # se resiste a irse. Sale corta y limpia.
    animation = windowsOut, 1, 2.2, iosQuick, popin 94%
    animation = border, 1, 4, iosQuick
    animation = fade, 1, 2.6, iosQuick

    # Omarchy trae esto en `0` (desactivado). Activarlo es el cambio que mas se
    # nota de todo el tema: cambiar de escritorio pasa de ser un corte seco a
    # un deslizamiento, como pasar de pantalla en un movil.
    animation = workspaces, 1, 3.2, iosOut, slide
    animation = specialWorkspace, 1, 3, iosOut, slidevert

    # Las capas son waybar, walker y las notificaciones. Entran con rebote y
    # fundido; salen rapido para no estorbar.
    animation = layers, 1, 3, iosOut
    animation = layersIn, 1, 3.4, iosOut, fade
    animation = layersOut, 1, 2, iosQuick, fade
}

# --- Capas (paneles que no son ventanas) ---------------------------------
#
# Sintaxis de hyprland 0.53+: `<regla> <valor>, match:namespace <ns>`. La forma
# antigua `layerrule = blur,waybar` ya NO se acepta (da "invalid field blur:
# missing a value"). Los namespaces de abajo son los reales de este equipo,
# comprobados con `hyprctl layers`.
#
# ignore_alpha evita el efecto halo: sin el, hyprland desenfoca tambien los
# pixeles totalmente transparentes que rodean al panel redondeado y aparece un
# cerco borroso cuadrado alrededor. El umbral debe quedar POR DEBAJO del alpha
# del panel, o se desenfocaria el panel entero a nada.
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar

layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0.2, match:namespace walker

layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.2, match:namespace notifications
