include=~/.local/share/omarchy/default/mako/core.ini

# Mako acepta hex de 8 digitos: los dos ultimos son el alpha. A8 = ~66%.
# El desenfoque de detras lo pone hyprland con
# `layerrule = blur on, match:namespace notifications` (ver hyprland.conf).
text-color=#EDEDF0
border-color=#FFFFFF33
background-color=#1A1A20A8

# Nota: ~/.config/mako/config incluye ESTE fichero y despues fija
# border-radius=8, y en mako gana lo ultimo que se lee. Si quieres el redondeo
# generoso de iOS, sube alli ese valor a 14.
progress-color=over #0A84FF66
